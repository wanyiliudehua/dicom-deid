[project]
name = "dicom-deid"
version = "1.0.1"
description = "DICOM 医学影像脱敏工具（交互式 TUI）"
requires-python = ">=3.11"
dependencies = [
    "pydicom>=2.4",
    "numpy>=1.24",
    "textual>=0.80",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
dicom-deid = "dicom_deid.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dicom_deid*"]